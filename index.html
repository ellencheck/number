<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Энциклопедия больших чисел</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#312e81);color:#e2e8f0;min-height:100vh;margin:0;padding:25px 14px;display:flex;justify-content:center;align-items:center}.container{background:#1e293b;padding:26px;border-radius:22px;width:100%;max-width:680px;box-shadow:0 15px 45px #0006}h1{text-align:center;color:#7dd3fc;font-size:27px}.subtitle{text-align:center;color:#cbd5e1;line-height:1.6}input{width:100%;padding:15px;margin-top:12px;border-radius:10px;border:2px solid #475569;background:#0f172a;color:white;font-size:18px}button{padding:12px;border:0;border-radius:10px;background:#38bdf8;color:#0f172a;font-weight:bold;cursor:pointer}.mainbtn{width:100%;margin-top:10px;font-size:17px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.quick button{font-size:14px}.result{margin-top:20px;padding:20px;background:#0f172a;border-radius:14px;line-height:1.7;overflow-wrap:anywhere}.result h2{text-align:center;color:#7dd3fc}.number{color:#facc15;font-weight:bold;overflow-wrap:anywhere}.small{color:#94a3b8;font-size:13px}.error{color:#fca5a5}.note{color:#94a3b8;font-size:13px;line-height:1.5;margin-top:18px}@media(max-width:450px){.quick{grid-template-columns:repeat(2,1fr)}.container{padding:18px}}
</style>
</head>
<body><main class="container">
<h1>🔢 Энциклопедия больших чисел</h1>

<p class="subtitle">Укажи показатель степени — узнай название числа.</p>
<p class="note">Для чисел от 10⁶ до 10¹⁰⁵ используются названия короткой шкалы Конвея—Векслера. Это систематическая номенклатура, а не перечень общеупотребительных математических терминов.</p>
<input id="power" type="text" inputmode="numeric" placeholder="Например: 6" aria-label="Количество нулей">
<button class="mainbtn" id="show">Узнать число</button>
<div class="quick">
<button data-p="6">Миллион · 10⁶</button>
<button data-p="9">Миллиард · 10⁹</button>
<button data-p="12">Триллион · 10¹²</button>
</div>
<div class="result" id="result" aria-live="polite">Здесь появится результат.</div>

</main>
<script>
const known={
  3:"тысяча",
  6:"миллион",
  9:"миллиард",
  12:"триллион",
  15:"квадриллион",
  18:"квинтиллион",
  21:"секстиллион",
  24:"септиллион",
  27:"октиллион",
  30:"нониллион",
  33:"дециллион",
  36:"ундециллион",
  39:"дуодециллион",
  42:"тредециллион",
  45:"кваттуордециллион",
  48:"квиндециллион",
  51:"седециллион",
  54:"септендециллион",
  57:"октодециллион",
  60:"новендециллион",
  63:"вигинтиллион",
  66:"унвигинтиллион",
  69:"дуовигинтиллион",
  72:"тресвигинтиллион",
  75:"кваттуорвигинтиллион",
  78:"квинвигинтиллион",
  81:"сесвигинтиллион",
  84:"септемвигинтиллион",
  87:"октовигинтиллион",
  90:"новемвигинтиллион",
  93:"тригинтиллион",
  96:"унтригинтиллион",
  99:"дуотригинтиллион",
  102:"трестригинтиллион",
  105:"кваттуортригинтиллион"
};
const googol=10n**100n;
function fmt(s){return s.replace(/\B(?=(\d{3})+(?!\d))/g," ");}
function describe(raw){
  let p;
  const word=raw.toLowerCase().replace(/ё/g,"е");
  if(word==="гуголплекс"||word==="googolplex")p=googol;
  else if(word==="гугол"||word==="гогол"||word==="googol")p=100n;
  else if(/^\d+$/.test(raw))p=BigInt(raw);
  else throw new Error("Введи показатель степени цифрами.");
  if(p<1n)throw new Error("Показатель степени должен быть больше нуля.");
  if(p>googol)throw new Error("Слишком большое число.");
  if(p===1n)return {title:"Десять",notation:"10¹",zeros:"1"};
  if(p===2n)return {title:"Сто",notation:"10²",zeros:"2"};
  if(p===100n)return {title:"Гугол",notation:"10¹⁰⁰",zeros:"100"};
  if(p===googol)return {title:"Гуголплекс",notation:"10^(10¹⁰⁰)",zeros:"гугол"};
  const n=Number(p);
  const title=known[n]||"Отдельного названия в этой системе нет";
  const systemNote=n>=36&&known[n]?"Название по короткой шкале Конвея—Векслера":"";
  return {title,systemNote,notation:"10^"+fmt(p.toString()),zeros:fmt(p.toString())};
}
function show(){
  const raw=document.getElementById("power").value.trim().replace(/[ ,]/g,"");
  const box=document.getElementById("result");
  try{
    const d=describe(raw);
    box.innerHTML="<h2>"+d.title+"</h2>"+(d.systemNote?"<p class='small'>"+d.systemNote+"</p>":"")+"<p><b>Число:</b> <span class='number'>"+d.notation+"</span></p><p><b>Нулей:</b> "+d.zeros+"</p>";
  }catch(e){box.innerHTML='<p class="error">'+e.message+"</p>";}
}
document.getElementById("show").addEventListener("click",show);
document.getElementById("power").addEventListener("keydown",e=>{if(e.key==="Enter")show();});
document.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{document.getElementById("power").value=b.dataset.p;show();}));
</script></body></html>
