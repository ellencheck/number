<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Энциклопедия больших чисел</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#312e81);color:#e2e8f0;min-height:100vh;margin:0;padding:25px 14px;display:flex;justify-content:center;align-items:center}.container{background:#1e293b;padding:26px;border-radius:22px;width:100%;max-width:680px;box-shadow:0 15px 45px #0006}h1{text-align:center;color:#7dd3fc;font-size:27px}.subtitle{text-align:center;color:#cbd5e1;line-height:1.6}input{width:100%;padding:15px;margin-top:12px;border-radius:10px;border:2px solid #475569;background:#0f172a;color:white;font-size:18px}button{padding:12px;border:0;border-radius:10px;background:#38bdf8;color:#0f172a;font-weight:bold;cursor:pointer}.mainbtn{width:100%;margin-top:10px;font-size:17px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.quick button{font-size:14px}.result{margin-top:20px;padding:20px;background:#0f172a;border-radius:14px;line-height:1.7;overflow-wrap:anywhere}.result h2{text-align:center;color:#7dd3fc}.number{color:#facc15;font-weight:bold;overflow-wrap:anywhere}.small{color:#94a3b8;font-size:13px}.error{color:#fca5a5}.note{color:#cbd5e1;font-size:13px;line-height:1.55;margin-top:14px}.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin-top:22px;padding:12px;background:#172554;border:1px solid #334155;border-radius:14px}.legend-item{display:flex;align-items:center;gap:9px;font-size:13px;line-height:1.2}.dot{flex:0 0 11px;height:11px;border-radius:50%;margin-top:3px}.green{background:#34d399}.amber{background:#fbbf24}.violet{background:#c084fc}.tag{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:bold}.tag-green{background:#064e3b;color:#a7f3d0}.tag-amber{background:#78350f;color:#fde68a}.tag-violet{background:#581c87;color:#e9d5ff}.tag-none{background:#334155;color:#cbd5e1}.sources{font-size:12px;color:#94a3b8;line-height:1.6;margin-top:14px}.sources a{color:#7dd3fc}@media(max-width:450px){.quick{grid-template-columns:repeat(2,1fr)}.container{padding:18px}}
</style>
</head>
<body><main class="container">
<h1>🔢 Энциклопедия больших чисел</h1>

<p class="subtitle">Укажи показатель степени — узнай название числа.</p>
<input id="power" type="text" inputmode="numeric" placeholder="Например: 6" aria-label="Показатель степени десяти">
<button class="mainbtn" id="show">Узнать название</button>
<div class="quick">
<button data-p="6">Миллион · 10⁶</button>
<button data-p="9">Миллиард · 10⁹</button>
<button data-p="12">Триллион · 10¹²</button>
</div>
<div class="result" id="result" aria-live="polite">Здесь появится результат.</div>
<section class="legend" aria-label="Категории названий">
<div class="legend-item"><span class="dot green"></span><b>Общепринятое</b></div>
<div class="legend-item"><span class="dot amber"></span><b>Редкое</b></div>
<div class="legend-item"><span class="dot violet"></span><b>Систематическое</b></div>
</section>


</main>
<script>
const names = {
  1:["миллион","million","common"],
   2:["миллиард","milliard","common"],
  3:["триллион","trillion","common"],
  4:["квадриллион","quadrillion","common"],
  5:["квинтиллион","quintillion","common"],
  6:["секстиллион","sextillion","common"],
  7:["септиллион","septillion","common"],
  8:["октиллион","octillion","common"],
  9:["нониллион","nonillion","common"],
  10:["дециллион","decillion","system"],
  11:["ундециллион","undecillion","system"],
  12:["дуодециллион","duodecillion","system"],
  13:["тредециллион","tredecillion","system"],
  14:["кваттуордециллион","quattuordecillion","system"],
  15:["квиндециллион","quindecillion","system"],
  16:["седециллион","sedecillion","system"],
  17:["септендециллион","septendecillion","system"],
  18:["октодециллион","octodecillion","system"],
  19:["новемдециллион","novemdecillion","system"],
  20:["вигинтиллион","vigintillion","system"],
  32:["дуотригинтиллион","duotrigintillion","system"],
  33:["трестригинтиллион","trestrigintillion","system"],
  34:["кваттуортригинтиллион","quattuortrigintillion","system"],
  100:["центиллион","centillion","rare"],
  1000:["миллиллион","millillion","rare"]
};
const status = {
  common:["Общепринятое","tag-green"],
  rare:["Редкое","tag-amber"],
  system:["Систематическое","tag-violet"],
  none:["Нет","tag-none"]
};
const superscript = s => String(s).replace(/-/g,"⁻").replace(/0/g,"⁰").replace(/1/g,"¹").replace(/2/g,"²").replace(/3/g,"³").replace(/4/g,"⁴").replace(/5/g,"⁵").replace(/6/g,"⁶").replace(/7/g,"⁷").replace(/8/g,"⁸").replace(/9/g,"⁹");
const fmt = s => String(s).replace(/\B(?=(\d{3})+(?!\d))/g," ");
function render(title,p,label,latin="",zeros=p){
 const [word,tag]=status[label];
 const latinLine=latin?'<p><b>Латинская форма:</b> '+latin+'</p>':"";
 document.getElementById("result").innerHTML =
  '<h2>'+title+'</h2><p><span class="tag '+tag+'">'+word+'</span></p>'+
  latinLine+'<p><b>Степень:</b> <span class="number">10'+superscript(p)+'</span></p>'+
  '<p><b>Количество нулей:</b> '+zeros+'</p>';
}
function describe(raw){
 const s=raw.trim().replace(/[\s,]/g,"").toLowerCase();
 if(s==="гугол"||s==="googol"){render("Гугол","100","rare","googol","100");return;}
 if(s==="гуголплекс"||s==="googolplex"){render("Гуголплекс","(10¹⁰⁰)","rare","","гугол");return;}
 let p;
 if(!/^\d+$/.test(s))throw Error("Введи целый показатель степени.");
 p=BigInt(s);
 if(p>1000000000000n)throw Error("Слишком большой показатель.");
 if(p===0n){render("Один","0","common","","0");return;}
 if(p===1n){render("Десять","1","common","","1");return;}
 if(p===2n){render("Сто","2","common","","2");return;}
 if(p===3n){render("Тысяча","3","common","","3");return;}
 if(p===100n){render("Гугол","100","rare","googol","100");return;}
 if(p===303n){render("Центиллион","303","rare","centillion","303");return;}
 if(p%3n===0n){
  const index=Number(p/3n-1n), item=names[index];
  if(item){render(item[0],p.toString(),item[2],item[1],fmt(p.toString()));return;}
  render("Отдельного названия нет",p.toString(),"none","",fmt(p.toString()));return;
 }
 const rem=Number(p%3n), base=p-BigInt(rem);
 if(base===3n){
  render(rem===1?"Десять тысяч":"Сто тысяч",p.toString(),"common","",fmt(p.toString()));return;
 }
 const index=Number(base/3n-1n), item=names[index];
 if(item){
  const plural = item[0]==="миллиард"?"миллиардов":item[0].replace(/иллион$/,"иллионов");
  render((rem===1?"Десять ":"Сто ")+plural,p.toString(),"none",item[1],fmt(p.toString()));return;
 }
 render("Отдельного названия нет",p.toString(),"none","",fmt(p.toString()));
}
function show(){
 const raw=document.getElementById("power").value;
 try{describe(raw);}catch(e){document.getElementById("result").innerHTML='<p class="error">'+e.message+'</p>';}
}
document.getElementById("show").addEventListener("click",show);
document.getElementById("power").addEventListener("keydown",e=>{if(e.key==="Enter")show();});
document.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{document.getElementById("power").value=b.dataset.p;show();}));
</script></body></html>
