
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Энциклопедия больших чисел</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #312e81);
    color: #e2e8f0;
    min-height: 100vh;
    margin: 0;
    padding: 30px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: #1e293b;
    padding: 30px;
    border-radius: 22px;
    width: 100%;
    max-width: 550px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(0,0,0,0.4);
}

h1 {
    color: #7dd3fc;
    font-size: 27px;
}

.subtitle {
    color: #cbd5e1;
    line-height: 1.6;
}

input {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border-radius: 10px;
    border: 2px solid #475569;
    background: #0f172a;
    color: white;
    font-size: 20px;
    text-align: center;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    color: #0f172a;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #7dd3fc;
}

.result {
    margin-top: 25px;
    padding: 20px;
    background: #0f172a;
    border-radius: 14px;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.result h2 {
    color: #7dd3fc;
}

.number {
    color: #facc15;
    font-size: 19px;
    font-weight: bold;
}

.small {
    color: #94a3b8;
    font-size: 14px;
}

.error {
    color: #fca5a5;
}

.quick {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 18px;
}

.quick button {
    font-size: 14px;
    padding: 10px 5px;
    margin: 0;
}

</style>
</head>

<body>

<div class="container">

<h1>🔢 Энциклопедия больших чисел</h1>

<p class="subtitle">
Введи степень десяти от 1 до 100.
Узнай название числа и количество нулей.
</p>

<input
    type="number"
    id="power"
    min="1"
    max="100"
    step="1"
    placeholder="Например: 63"
>

<button onclick="getName()">Узнать число</button>

<div class="quick">
    <button onclick="setPower(6)">Миллион</button>
    <button onclick="setPower(33)">Дециллион</button>
    <button onclick="setPower(63)">Вигинтиллион</button>
    <button onclick="setPower(93)">Тригинтиллион</button>
    <button onclick="setPower(99)">Дуотригинтиллион</button>
    <button onclick="setPower(100)">Гугол</button>
</div>

<div class="result" id="result">
    Здесь появится название числа.
</div>

</div>

<script>

// Названия степеней, кратных трём.
// Используется короткая шкала.

const names = {
    3: "тысяча",
    6: "миллион",
    9: "миллиард",
    12: "триллион",
    15: "квадриллион",
    18: "квинтиллион",
    21: "секстиллион",
    24: "септиллион",
    27: "октиллион",
    30: "нониллион",
    33: "дециллион",
    36: "ундециллион",
    39: "дуодециллион",
    42: "тредециллион",
    45: "кваттуордециллион",
    48: "квиндециллион",
    51: "сексдециллион",
    54: "септендециллион",
    57: "октодециллион",
    60: "новемдециллион",
    63: "вигинтиллион",
    66: "унвигинтиллион",
    69: "дуовигинтиллион",
    72: "тревигинтиллион",
    75: "кваттуорвигинтиллион",
    78: "квинвигинтиллион",
    81: "сексвигинтиллион",
    84: "септенвигинтиллион",
    87: "октовигинтиллион",
    90: "новемвигинтиллион",
    93: "тригинтиллион",
    96: "унтригинтиллион",
    99: "дуотригинтиллион"
};


// Создание записи числа без использования Number,
// чтобы не терять точность больших чисел.

function makeNumber(power) {
    return "1" + "0".repeat(power);
}


// Основная функция

function getName() {

    const input = document.getElementById("power");
    const result = document.getElementById("result");

    const p = Number(input.value);

    if (
        input.value.trim() === "" ||
        !Number.isInteger(p) ||
        p < 1 ||
        p > 100
    ) {
        result.innerHTML =
            '<p class="error">Введи целое число от 1 до 100.</p>';
        return;
    }

    let name = "";

    if (p === 1) {
        name = "десять";
    }

    else if (p === 2) {
        name = "сто";
    }

    else if (p === 100) {
        name = "гугол (googol)";
    }

    else if (names[p]) {
        name = names[p];
    }

    else {
        name = "Отдельного стандартного названия нет";
    }

    const number = makeNumber(p);

    const explanation = names[p]
        ? "Общепринятое название числа."
        : p === 100
        ? "Специальное название большого числа."
        : "Это степень десяти без отдельного названия в системе -иллионов.";

    result.innerHTML = `
        <h2>${name}</h2>

        <p class="number">10<sup>${p}</sup></p>

        <p><b>Количество нулей:</b> ${p}</p>

        <p><b>Название:</b> ${name}</p>

        <p class="small">${explanation}</p>

        <p class="small">
        Полная запись числа:
        </p>

        <div class="number">${number}</div>
    `;
}


// Быстрый выбор числа

function setPower(p) {
    document.getElementById("power").value = p;
    getName();
}


// Запуск по нажатию Enter

document.getElementById("power")
.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        getName();
    }
});

</script>

</body>
</html>
